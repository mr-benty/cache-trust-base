name: cache-trust
on: { pull_request: {} }
jobs:
  poison:
    runs-on: ubuntu-latest
    steps:
      - run: echo "POISONED-BY-FORK-DEPTEST" > ./artifact.txt
      - name: write poisoned cache (key build- prefix to match base restore-keys)
        uses: actions/cache@v4
        with:
          path: ./artifact.txt
          key: build-main-v1
